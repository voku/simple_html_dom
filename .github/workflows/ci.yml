on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            7.1,
            7.2,
            7.3,
            7.4,
            8.0,
            8.1,
            8.2,
            8.3,
            8.4
        ]
        composer: [basic]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            composer config allow-plugins.infection/extension-installer true
            composer require phpstan/phpstan:^2.1 infection/infection:^0.32.7 --dev --no-update --no-interaction
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        run: |
          mkdir -p build/logs
          php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: Run infection with phpstan integration
        if: ${{ matrix.php == '8.3' }}
        run: |
          mkdir -p build/logs
          XDEBUG_MODE=coverage php vendor/bin/infection run --configuration=infection.json5

      - name: Upload coverage results to Coveralls
        continue-on-error: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: 'true'
          COVERALLS_FLAG_NAME: php-${{ matrix.php }}-${{ matrix.composer }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/logs/clover.xml

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs

  finalize-agent-loop-tool-dependencies:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/shd-parser-backlog-sync' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/shd-parser-backlog-sync
          fetch-depth: 0

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Resolve explicit isolated-tool dependencies
        run: |
          cp tools/agent-loop/composer.lock /tmp/agent-loop-composer.lock.before
          (
            cd tools/agent-loop
            composer update voku/agent-loop phpstan/phpstan --with-all-dependencies --prefer-dist --no-interaction
            composer validate --strict
          )

          php <<'PHP'
          <?php
          declare(strict_types=1);

          /** @return array<string, array<string, mixed>> */
          function packageMap(string $path): array
          {
              $lock = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              $result = [];
              foreach (['packages', 'packages-dev'] as $section) {
                  foreach ($lock[$section] ?? [] as $package) {
                      if (is_array($package) && is_string($package['name'] ?? null)) {
                          $result[$package['name']] = $package;
                      }
                  }
              }

              return $result;
          }

          $before = packageMap('/tmp/agent-loop-composer.lock.before');
          $after = packageMap('tools/agent-loop/composer.lock');
          $changed = [];
          foreach (array_unique(array_merge(array_keys($before), array_keys($after))) as $name) {
              if (($before[$name] ?? null) !== ($after[$name] ?? null)) {
                  $changed[] = $name;
              }
          }
          sort($changed, SORT_STRING);
          if ($changed !== ['phpstan/phpstan']) {
              fwrite(STDERR, 'Unexpected dependency delta while making PHPStan explicit: ' . json_encode($changed, JSON_THROW_ON_ERROR) . PHP_EOL);
              exit(1);
          }

          $expectedVersions = [
              'voku/agent-kanban' => '0.3.2',
              'voku/agent-learning' => '0.13.1',
              'voku/agent-loop' => '0.16.6',
              'voku/agent-map' => '0.8.2',
              'voku/agent-recall-compiler' => '0.13.6',
              'voku/agent-session' => '0.6.1',
          ];
          foreach ($expectedVersions as $name => $version) {
              if (($after[$name]['version'] ?? null) !== $version) {
                  fwrite(STDERR, sprintf('Expected %s %s, got %s.%s', $name, $version, (string) ($after[$name]['version'] ?? 'missing'), PHP_EOL));
                  exit(1);
              }
          }

          $phpstanVersion = $after['phpstan/phpstan']['version'] ?? null;
          if (!is_string($phpstanVersion) || preg_match('/^2\./', $phpstanVersion) !== 1) {
              fwrite(STDERR, 'Expected an explicit PHPStan 2.x tool dependency, got ' . (string) ($phpstanVersion ?? 'missing') . '.' . PHP_EOL);
              exit(1);
          }
          PHP

      - name: Replay durable validation command
        run: php tools/agent-loop/vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: Dogfood pruned-session resume through installed dependencies
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          require __DIR__ . '/tools/agent-loop/vendor/autoload.php';

          use voku\AgentLoop\Run\GovernedRunStore;
          use voku\AgentLoop\Workflow\TaskContractStore;
          use voku\AgentLoop\Workflow\WorkflowApproveCommand;
          use voku\AgentSession\SessionStatus;
          use voku\AgentSession\SessionStore;

          $root = sys_get_temp_dir() . '/simple-html-dom-agent-loop-resume-' . bin2hex(random_bytes(5));
          mkdir($root, 0o775, true);
          mkdir($root . '/.agent-loop/learning', 0o775, true);

          $removeDirectory = static function (string $path) use (&$removeDirectory): void {
              if (!is_dir($path)) {
                  return;
              }
              foreach (new RecursiveIteratorIterator(
                  new RecursiveDirectoryIterator($path, RecursiveDirectoryIterator::SKIP_DOTS),
                  RecursiveIteratorIterator::CHILD_FIRST,
              ) as $item) {
                  $item->isDir() ? rmdir($item->getPathname()) : unlink($item->getPathname());
              }
              rmdir($path);
          };

          try {
              $contracts = new TaskContractStore($root);
              $contracts->create(
                  'ABC-123',
                  'Resume the same governed Run after working memory disappears.',
                  ['README.md'],
                  ['Do not rebind Run identity.'],
                  ['vendor/bin/phpunit'],
                  'lars',
              );
              $contract = $contracts->approve('ABC-123', 'lars');

              $sessions = new SessionStore();
              $session = $sessions->rehydrate(
                  $root . '/.agent-loop/sessions',
                  '2001-02-03-abc-123-r1-deadbeef',
                  'ABC-123',
                  'lars',
                  $contract->baseCommit,
              );
              $runStore = new GovernedRunStore($root);
              $run = $runStore->prepare($contract, $session, $root . '/.agent-loop/learning');
              $removeDirectory($session->path);

              $approve = new WorkflowApproveCommand(
                  $root,
                  static function (array $argv) use ($root): int {
                      $recallRoot = $root . '/.agent-loop/recall/ABC-123';
                      if (!is_dir($recallRoot)) {
                          mkdir($recallRoot, 0o775, true);
                      }
                      file_put_contents(
                          $recallRoot . '/meta.json',
                          json_encode([
                              'schema_version' => '1.0',
                              'task_id' => 'ABC-123',
                              'compilation_id' => 'ABC-123-consumer-proof',
                              'selected_guidance' => [],
                              'selected_constraints' => [],
                              'output_hashes' => [],
                          ], JSON_THROW_ON_ERROR),
                      );

                      return 0;
                  },
              );

              ob_start();
              $exit = $approve->run(['ABC-123', '--by', 'lars']);
              $output = (string) ob_get_clean();
              if ($exit !== 0) {
                  fwrite(STDERR, $output);
                  exit($exit);
              }

              $rehydrated = $sessions->load($root . '/.agent-loop/sessions', $session->id);
              $resumedRun = $runStore->find('ABC-123');
              if ($rehydrated->id !== $session->id || $rehydrated->status !== SessionStatus::ACTIVE) {
                  fwrite(STDERR, 'Installed consumer did not rehydrate the exact active Session identity.' . PHP_EOL);
                  exit(1);
              }
              if ($resumedRun === null || $resumedRun->runId !== $run->runId || $resumedRun->sessionId !== $session->id) {
                  fwrite(STDERR, 'Installed consumer changed durable Run/Session identity during resume.' . PHP_EOL);
                  exit(1);
              }
          } finally {
              $removeDirectory($root);
          }
          PHP

      - name: Verify governed board state
        run: php tools/agent-loop/vendor/bin/agent-loop board verify

      - name: Guard and publish final tool dependency state
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^tools/agent-loop/composer\.lock$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files from dependency resolution:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check

          git checkout "${{ github.event.pull_request.base.sha }}" -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agent-loop/composer.lock .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'chore: keep PHPStan explicit in agent tool project'
          git push origin HEAD:agent/shd-parser-backlog-sync

  coveralls-finish:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close Coveralls parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
