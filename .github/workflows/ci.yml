on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            '7.1',
            '7.2',
            '7.3',
            '7.4',
            '8.0',
            '8.1',
            '8.2',
            '8.3',
            '8.4'
        ]
        composer: [basic]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            composer config allow-plugins.infection/extension-installer true
            composer require phpstan/phpstan:^2.1 infection/infection:^0.32.7 --dev --no-update --no-interaction
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        run: |
          mkdir -p build/logs
          php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: Run infection with phpstan integration
        if: ${{ matrix.php == '8.3' }}
        run: |
          mkdir -p build/logs
          XDEBUG_MODE=coverage php vendor/bin/infection run --configuration=infection.json5

      - name: Upload coverage results to Coveralls
        continue-on-error: true
        env:
            COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            composer global require php-coveralls/php-coveralls
            php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/logs/clover.xml
          
      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs

  modern-parser-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: benchmark-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: benchmark-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction
          composer dump-autoload -o

      - name: Run modern parser benchmarks
        run: |
          mkdir -p build/logs
          php build/benchmark_modern_html_parser.php | tee build/logs/benchmark-php-${{ matrix.php }}.tsv

      - name: Publish benchmark summary
        env:
          BENCHMARK_FILE: build/logs/benchmark-php-${{ matrix.php }}.tsv
          BENCHMARK_MODERN_PARSER_LABEL: modern+bridge
          PHP_VERSION_LABEL: ${{ matrix.php }}
        run: |
          python3 - <<'PY'
          import csv
          import os

          benchmark_file = os.environ['BENCHMARK_FILE']
          benchmark_parser = os.environ['BENCHMARK_MODERN_PARSER_LABEL']
          php_version = os.environ['PHP_VERSION_LABEL']
          summary_file = os.environ['GITHUB_STEP_SUMMARY']

          with open(benchmark_file, newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))

          modern_rows = [row for row in rows if row['parser'] == benchmark_parser]

          with open(summary_file, 'a') as summary:
              summary.write('## Modern parser benchmark (PHP ' + php_version + ')\n\n')
              summary.write('| Scenario | Status | Total vs legacy | Parse vs legacy | Selector vs legacy | Serialize vs legacy |\n')
              summary.write('| --- | --- | --- | --- | --- | --- |\n')

              for row in modern_rows:
                  summary.write(
                      '| {scenario} | {status} | {total} | {parse} | {selector} | {serialize} |\n'.format(
                          scenario=row['scenario'],
                          status=row['comparison_status'],
                          total=row['total_vs_legacy'],
                          parse=row['parse_vs_legacy'],
                          selector=row['selector_vs_legacy'],
                          serialize=row['serialize_vs_legacy'],
                      )
                  )
          PY

      - name: Archive benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modern-parser-benchmark-php-${{ matrix.php }}
          path: build/logs/benchmark-php-${{ matrix.php }}.tsv
