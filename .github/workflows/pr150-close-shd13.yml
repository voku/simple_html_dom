name: PR 150 close SHD-13

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4
    paths:
      - .github/workflows/pr150-close-shd13.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
          tools: composer

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          composer install --working-dir=tools/agent-loop --prefer-dist --no-interaction

      - name: Plan and approve exact follow-up
        run: |
          php bin/agent-loop map build --paths=src
          php bin/agent-loop workflow plan SHD-13 \
            --by voku \
            --file src/voku/helper/Html5DomParser.php \
            --goal 'Bind the PHP 8.3 static-analysis portability documentation and suppressions for PHP 8.4-only Dom symbols without changing parser runtime behavior.' \
            --behavior-anchor 'Html5DomParser runtime logic stays unchanged; only PHPDoc and PHPStan symbol-discovery annotations around guarded PHP 8.4-only references differ from the SHD-11 candidate.' \
            --validation 'php vendor/bin/phpunit -c phpunit.xml' \
            --validation 'php tools/agent-loop/vendor/bin/phpstan analyse -c phpstan.neon --no-progress'
          php bin/agent-loop workflow approve SHD-13 --by voku
          php bin/agent-loop workflow status SHD-13 --format=json

      - name: Validate and record exact observations
        shell: bash
        run: |
          set -uo pipefail
          record() {
            local command="$1"
            local start end duration exit_code status
            start=$(date +%s%3N)
            set +e
            bash -lc "$command"
            exit_code=$?
            set -e
            end=$(date +%s%3N)
            duration=$((end - start))
            if [ "$exit_code" -eq 0 ]; then status=passed; else status=failed; fi
            php bin/agent-loop session validation record SHD-13 \
              --contract-revision 1 \
              --command "$command" \
              --status "$status" \
              --exit-code "$exit_code" \
              --duration-ms "$duration" \
              --by voku
            return "$exit_code"
          }
          set -e
          record 'php vendor/bin/phpunit -c phpunit.xml'
          record 'php tools/agent-loop/vendor/bin/phpstan analyse -c phpstan.neon --no-progress'

      - name: Review and checkpoint
        shell: bash
        run: |
          php bin/agent-loop review code SHD-13
          php bin/agent-loop session checkpoint SHD-13 \
            --title 'L2 blind-spot review checkpoint' \
            --body 'Normal repository CI exposed PHP 8.3 static-analysis discovery errors for guarded PHP 8.4-only Dom symbols. The follow-up changes only PHPDoc/PHPStan annotations in Html5DomParser.php. Full PHPUnit and PHPStan on PHP 8.3 passed; no parser runtime behavior changed.'
          set +e
          php bin/agent-loop review blindspots SHD-13
          initial_review_exit=$?
          set -e
          echo "INITIAL_BLINDSPOT_EXIT=${initial_review_exit}"
          cat .agent-loop/recall/SHD-13/reviews/SHD-13.blindspots.json

      - name: Record no durable learning
        run: |
          php bin/agent-loop workflow learn SHD-13 \
            --status no_durable_learning \
            --by voku \
            --reason 'Annotation/PHPDoc-only portability binding for PHPStan on PHP 8.3; the underlying PHP 8.4 symbol-boundary behavior is already captured by SHD-11 and no new reusable product rule emerged.'

      - name: Require clean post-learning review
        run: |
          php bin/agent-loop review blindspots SHD-13
          cat .agent-loop/recall/SHD-13/reviews/SHD-13.blindspots.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.agent-loop/recall/SHD-13/reviews/SHD-13.blindspots.json').read_text())
          findings = report.get('findings', [])
          if findings:
              raise SystemExit('blind-spot findings remain: ' + ', '.join(item.get('id', '?') for item in findings))
          if report.get('status') != 'ok':
              raise SystemExit('blind-spot report is not ok: ' + str(report.get('status')))
          print('Blind-spot report is clean.')
          PY

      - name: Close governed Run
        run: |
          php bin/agent-loop workflow close SHD-13 --status done
          php bin/agent-loop workflow status SHD-13 --expect complete --format=json
          php bin/agent-loop workflow report SHD-13

      - name: Commit durable evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent-loop
          git diff --cached --check
          git commit -m 'Close governed SHD-13 run'
          git push origin HEAD:claude/php-8.4-dom-htmldocument-vronm4
