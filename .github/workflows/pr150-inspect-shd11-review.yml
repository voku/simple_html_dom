name: PR 150 inspect SHD-11 review

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4
    paths:
      - .github/workflows/pr150-inspect-shd11-review.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - name: Install workflow tool
        run: composer install --working-dir=tools/agent-loop --prefer-dist --no-interaction
      - name: Print closeout command help
        shell: bash
        run: |
          set +e
          for args in \
            'recall help' \
            'recall compile --help' \
            'recall log-outcome --help' \
            'session help' \
            'session checkpoint --help' \
            'session close --help' \
            'workflow help' \
            'workflow status SHD-11 --format=json' \
            'learn help'; do
            echo
            echo "===== php bin/agent-loop ${args} ====="
            php bin/agent-loop ${args}
            echo "EXIT=$?"
          done
          exit 0
