name: PR 150 finish SHD-11

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4
    paths:
      - .github/pr150-finalize-html5.py
      - .github/workflows/pr150-finalize-html5.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          composer install --working-dir=tools/agent-loop --prefer-dist --no-interaction

      - name: Prepare governed task
        run: |
          python3 .github/pr150-finalize-html5.py prepare
          php bin/agent-loop workflow status SHD-11 --format=json || true
          php bin/agent-loop workflow plan SHD-11 \
            --by voku \
            --file src/voku/helper/HtmlDomParser.php \
            --file src/voku/helper/Html5DomParser.php \
            --file tests/Html5DomParserAvailabilityTest.php \
            --file tests/Html5DomParserTest.php \
            --file tests/Html5DomParserCompatibilityTest.php \
            --file build/benchmark_html5_parser.php \
            --file README.md \
            --file CHANGELOG \
            --goal 'Finish the separate Html5DomParser boundary: an explicitly selected HTML5 parser must never silently become the libxml parser, and output cleanup must reverse only placeholders created by that backend.' \
            --behavior-anchor 'Html5DomParser::loadHtml -> shared input preparation -> PHP Dom HTMLDocument -> XML bridge -> legacy DOMDocument, with no parser-semantic fallback' \
            --behavior-anchor 'Html5DomParser output -> restore only keepBrokenHtml placeholders -> preserve caller-owned percent-encoded legacy protection tokens' \
            --validation 'php vendor/bin/phpunit -c phpunit.xml' \
            --validation 'php tools/agent-loop/vendor/bin/phpstan analyse -c phpstan.neon --no-progress' \
            --validation 'php build/benchmark_html5_parser.php'
          php bin/agent-loop map build --paths=src,tests,build
          php bin/agent-loop workflow approve SHD-11 --by voku
          php bin/agent-loop workflow status SHD-11 --format=json

      - name: Apply scoped implementation
        run: python3 .github/pr150-finalize-html5.py patch

      - name: Validate and record evidence
        shell: bash
        run: |
          set -uo pipefail

          record() {
            local command="$1"
            local start end duration exit_code status
            start=$(date +%s%3N)
            set +e
            bash -lc "$command"
            exit_code=$?
            set -e
            end=$(date +%s%3N)
            duration=$((end - start))
            if [ "$exit_code" -eq 0 ]; then
              status=passed
            else
              status=failed
            fi
            php bin/agent-loop session validation record SHD-11 \
              --contract-revision 1 \
              --command "$command" \
              --status "$status" \
              --exit-code "$exit_code" \
              --duration-ms "$duration" \
              --by voku
            return "$exit_code"
          }

          set -e
          record 'php vendor/bin/phpunit -c phpunit.xml'
          record 'php tools/agent-loop/vendor/bin/phpstan analyse -c phpstan.neon --no-progress'
          record 'php build/benchmark_html5_parser.php'

      - name: Produce deterministic review evidence
        run: |
          mkdir -p build/logs
          php bin/agent-loop review blindspots SHD-11 | tee build/logs/shd-11-blindspots.txt
          php bin/agent-loop review code SHD-11 | tee build/logs/shd-11-code-review.txt
          php bin/agent-loop workflow report SHD-11 \
            --changed-file src/voku/helper/HtmlDomParser.php \
            --changed-file src/voku/helper/Html5DomParser.php \
            --changed-file tests/Html5DomParserAvailabilityTest.php \
            --changed-file tests/Html5DomParserTest.php \
            --changed-file tests/Html5DomParserCompatibilityTest.php \
            --changed-file build/benchmark_html5_parser.php \
            --changed-file README.md \
            --changed-file CHANGELOG | tee build/logs/shd-11-workflow-report.txt

      - name: Commit candidate without closing the run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .agent-loop \
            src/voku/helper/HtmlDomParser.php \
            src/voku/helper/Html5DomParser.php \
            tests/Html5DomParserAvailabilityTest.php \
            tests/Html5DomParserTest.php \
            tests/Html5DomParserCompatibilityTest.php \
            build/benchmark_html5_parser.php \
            README.md \
            CHANGELOG
          git diff --cached --check
          git commit -m 'Make Html5DomParser an explicit backend choice (SHD-11)'
          git push origin HEAD:claude/php-8.4-dom-htmldocument-vronm4
