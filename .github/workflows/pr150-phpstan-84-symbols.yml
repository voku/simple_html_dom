name: PR 150 PHPStan 8.4 symbol guards

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4
    paths:
      - .github/workflows/pr150-phpstan-84-symbols.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Scope PHPStan ignores to PHP 8.4-only symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/voku/helper/Html5DomParser.php')
          text = path.read_text()

          old = '''        /** @phpstan-ignore class.notFound, classConstant.notFound (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
        $html5Document = \\Dom\\HTMLDocument::createFromString(
            $html,
            \\LIBXML_NOERROR | \\Dom\\HTML_NO_DEFAULT_NS,
            $overrideEncoding
        );'''
          new = '''        /** @phpstan-ignore class.notFound (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
        $html5Document = \\Dom\\HTMLDocument::createFromString(
            $html,
            /** @phpstan-ignore constant.notFound (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
            \\LIBXML_NOERROR | \\Dom\\HTML_NO_DEFAULT_NS,
            $overrideEncoding
        );'''
          if text.count(old) != 1:
              raise SystemExit(f'HTMLDocument block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        /** @phpstan-ignore class.notFound, argument.type (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
        $xPath = new \\Dom\\XPath($html5Document);
        $elements = $xPath->query('//*[@xmlns]');'''
          new = '''        /** @phpstan-ignore class.notFound, argument.type (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
        $xPath = new \\Dom\\XPath($html5Document);
        /** @phpstan-ignore class.notFound (\\Dom\\XPath of PHP >= 8.4) */
        $elements = $xPath->query('//*[@xmlns]');'''
          if text.count(old) != 1:
              raise SystemExit(f'XPath query block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        while ($xPath->query('//*[@' . $helper . ']')->length > 0) {'''
          new = '''        /** @phpstan-ignore class.notFound (\\Dom\\XPath of PHP >= 8.4) */
        while ($xPath->query('//*[@' . $helper . ']')->length > 0) {'''
          if text.count(old) != 1:
              raise SystemExit(f'XPath collision loop expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l src/voku/helper/Html5DomParser.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/voku/helper/Html5DomParser.php
          git commit -m 'Guard PHP 8.4-only symbols for PHPStan'
          git push origin HEAD:claude/php-8.4-dom-htmldocument-vronm4
