name: One-shot agent-loop dependency sync

on:
  push:
    branches:
      - agent/shd-parser-backlog-sync
    paths:
      - .github/workflows/one-shot-agent-loop-dependency-sync.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/shd-parser-backlog-sync
          fetch-depth: 0

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Resolve shipped agent-loop fixes
        run: |
          cp tools/agent-loop/composer.lock /tmp/agent-loop-composer.lock.before
          (
            cd tools/agent-loop
            composer update voku/agent-loop --with-all-dependencies --prefer-dist --no-interaction
            composer validate --strict
          )

          php <<'PHP'
          <?php
          declare(strict_types=1);

          /** @return array<string, array<string, mixed>> */
          function packageMap(string $path): array
          {
              $lock = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              $result = [];
              foreach ($lock['packages'] ?? [] as $package) {
                  if (is_array($package) && is_string($package['name'] ?? null)) {
                      $result[$package['name']] = $package;
                  }
              }

              return $result;
          }

          $before = packageMap('/tmp/agent-loop-composer.lock.before');
          $after = packageMap('tools/agent-loop/composer.lock');
          $changed = [];
          foreach (array_unique(array_merge(array_keys($before), array_keys($after))) as $name) {
              if (($before[$name] ?? null) !== ($after[$name] ?? null)) {
                  $changed[] = $name;
              }
          }
          sort($changed, SORT_STRING);
          $expected = ['voku/agent-loop', 'voku/agent-session'];
          if ($changed !== $expected) {
              fwrite(STDERR, 'Unexpected dependency delta: ' . json_encode($changed, JSON_THROW_ON_ERROR) . PHP_EOL);
              exit(1);
          }
          if (($after['voku/agent-loop']['version'] ?? null) !== '0.16.6') {
              fwrite(STDERR, 'Expected voku/agent-loop 0.16.6.' . PHP_EOL);
              exit(1);
          }
          if (($after['voku/agent-session']['version'] ?? null) !== '0.6.1') {
              fwrite(STDERR, 'Expected voku/agent-session 0.6.1.' . PHP_EOL);
              exit(1);
          }
          PHP

      - name: Dogfood pruned-session resume through installed dependencies
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          require __DIR__ . '/tools/agent-loop/vendor/autoload.php';

          use voku\AgentLoop\Run\GovernedRunStore;
          use voku\AgentLoop\Workflow\TaskContractStore;
          use voku\AgentLoop\Workflow\WorkflowApproveCommand;
          use voku\AgentSession\SessionStatus;
          use voku\AgentSession\SessionStore;

          $root = sys_get_temp_dir() . '/simple-html-dom-agent-loop-resume-' . bin2hex(random_bytes(5));
          mkdir($root, 0o775, true);
          mkdir($root . '/.agent-loop/learning', 0o775, true);

          $removeDirectory = static function (string $path) use (&$removeDirectory): void {
              if (!is_dir($path)) {
                  return;
              }
              foreach (new RecursiveIteratorIterator(
                  new RecursiveDirectoryIterator($path, RecursiveDirectoryIterator::SKIP_DOTS),
                  RecursiveIteratorIterator::CHILD_FIRST,
              ) as $item) {
                  $item->isDir() ? rmdir($item->getPathname()) : unlink($item->getPathname());
              }
              rmdir($path);
          };

          try {
              $contracts = new TaskContractStore($root);
              $contracts->create(
                  'SHD-RESUME-1',
                  'Replay the consumer defect that motivated SHD-12.',
                  ['README.md'],
                  ['Do not rebind durable Run identity.'],
                  ['test -f README.md'],
                  'consumer-dogfood',
              );
              $contract = $contracts->approve('SHD-RESUME-1', 'consumer-dogfood');

              $sessions = new SessionStore();
              $session = $sessions->rehydrate(
                  $root . '/.agent-loop/sessions',
                  '2001-02-03-shd-resume-1-r1-deadbeef',
                  'SHD-RESUME-1',
                  'consumer-dogfood',
                  $contract->baseCommit,
              );
              $runStore = new GovernedRunStore($root);
              $run = $runStore->prepare($contract, $session, $root . '/.agent-loop/learning');
              $removeDirectory($session->path);

              $approve = new WorkflowApproveCommand(
                  $root,
                  static function (array $argv) use ($root): int {
                      $recallRoot = $root . '/.agent-loop/recall/SHD-RESUME-1';
                      if (!is_dir($recallRoot)) {
                          mkdir($recallRoot, 0o775, true);
                      }
                      file_put_contents(
                          $recallRoot . '/meta.json',
                          json_encode([
                              'schema_version' => '1.0',
                              'task_id' => 'SHD-RESUME-1',
                              'compilation_id' => 'SHD-RESUME-1-consumer-proof',
                              'selected_guidance' => [],
                              'selected_constraints' => [],
                              'output_hashes' => [],
                          ], JSON_THROW_ON_ERROR),
                      );

                      return 0;
                  },
              );

              ob_start();
              $exit = $approve->run(['SHD-RESUME-1', '--by', 'consumer-dogfood']);
              $output = (string) ob_get_clean();
              if ($exit !== 0) {
                  fwrite(STDERR, $output);
                  exit($exit);
              }

              $rehydrated = $sessions->load($root . '/.agent-loop/sessions', $session->id);
              $resumedRun = $runStore->find('SHD-RESUME-1');
              if ($rehydrated->id !== $session->id || $rehydrated->status !== SessionStatus::ACTIVE) {
                  fwrite(STDERR, 'Installed consumer did not rehydrate the exact active Session identity.' . PHP_EOL);
                  exit(1);
              }
              if ($resumedRun === null || $resumedRun->runId !== $run->runId || $resumedRun->sessionId !== $session->id) {
                  fwrite(STDERR, 'Installed consumer changed durable Run/Session identity during resume.' . PHP_EOL);
                  exit(1);
              }

              echo '[OK] installed agent-loop 0.16.6 rehydrated the exact Run-bound Session after pruning.' . PHP_EOL;
          } finally {
              $removeDirectory($root);
          }
          PHP

      - name: Reconcile and archive resolved dogfood cards
        run: |
          python3 <<'PY'
          from pathlib import Path

          resolutions = {
              'SHD-4': 'Resolved upstream by voku/agent-loop#138 and consumed by the installed agent-loop 0.16.x toolchain.',
              'SHD-5': 'Resolved upstream by voku/agent-loop#138 and consumed by the installed agent-loop 0.16.x toolchain.',
              'SHD-6': 'Resolved upstream by voku/agent-loop#153 and consumed by the installed agent-loop 0.16.x toolchain.',
              'SHD-7': 'Resolved upstream by voku/agent-loop#151 and consumed by the installed agent-loop 0.16.x toolchain.',
              'SHD-8': 'Resolved upstream by voku/agent-loop#152 and consumed by the installed agent-loop 0.16.x toolchain.',
              'SHD-12': 'Resolved upstream by voku/agent-session#15 and voku/agent-loop#181; this consumer now locks agent-session 0.6.1 and agent-loop 0.16.6 and replays the exact-ID prune/resume regression.',
          }

          for task_id, resolution in resolutions.items():
              path = Path(f'.agent-loop/todo/cards/{task_id}.md')
              text = path.read_text()
              text = text.replace('- **Upstream owner:**', '- **Resolved upstream:**')
              text = text.replace(
                  'The owner-level fix is tracked upstream; this consumer card remains only as dogfood provenance.',
                  'The owner-level fix is shipped and consumed here; this card remains only as dogfood provenance.',
              )
              text = text.replace(
                  'The exact-ID rehydration fix is tracked at the owning packages; this consumer card remains only as dogfood provenance.',
                  'The exact-ID rehydration fix is shipped and consumed here; this card remains only as dogfood provenance.',
              )
              if '## Resolution\n' not in text:
                  text = text.rstrip() + f'\n\n## Resolution\n{resolution}\n'
              path.write_text(text)
          PY

          for task in SHD-4 SHD-5 SHD-6 SHD-7 SHD-8 SHD-12; do
            php tools/agent-loop/vendor/bin/agent-loop board card archive "$task"
          done
          php tools/agent-loop/vendor/bin/agent-loop board verify

      - name: Guard final scope
        run: |
          if ! git diff --quiet -- tools/agent-loop/composer.json; then
            echo 'tools/agent-loop/composer.json changed unexpectedly.' >&2
            git diff -- tools/agent-loop/composer.json >&2
            exit 1
          fi

          unexpected="$(git diff --name-only | grep -Ev '^((tools/agent-loop/composer\.lock)|(\.agent-loop/todo/(cards|archive)/SHD-(4|5|6|7|8|12)\.md)|(\.github/workflows/one-shot-agent-loop-dependency-sync\.yml))$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files in one-shot sync:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Commit result and remove helper
        run: |
          rm .github/workflows/one-shot-agent-loop-dependency-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agent-loop/composer.lock .agent-loop/todo .github/workflows/one-shot-agent-loop-dependency-sync.yml
          git diff --cached --check
          git commit -m 'chore: consume shipped agent-loop fixes'
          git push origin HEAD:agent/shd-parser-backlog-sync
