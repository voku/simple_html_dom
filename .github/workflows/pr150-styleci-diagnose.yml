name: PR 150 StyleCI diagnose

on:
  push:
    branches:
      - tmp/pr150-coverage-diagnose
    paths:
      - .github/workflows/pr150-styleci-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHP-CS-Fixer
        run: composer global require friendsofphp/php-cs-fixer:^3 --no-interaction
      - name: Show local equivalent of StyleCI delta
        shell: bash
        run: |
          cat > /tmp/styleci.php <<'PHP'
          <?php
          $finder = PhpCsFixer\Finder::create()
              ->in(['src', 'tests', 'build'])
              ->name('*.php');
          return (new PhpCsFixer\Config())
              ->setRiskyAllowed(true)
              ->setRules([
                  '@PSR2' => true,
                  'indentation_type' => false,
                  'no_unused_imports' => true,
                  'include' => true,
                  'single_quote' => true,
                  'ordered_imports' => true,
              ])
              ->setFinder($finder);
          PHP
          set +e
          "$HOME/.composer/vendor/bin/php-cs-fixer" fix \
            --config=/tmp/styleci.php \
            --dry-run \
            --diff \
            --verbose
          exit_code=$?
          echo "PHP_CS_FIXER_EXIT=${exit_code}"
          exit 0
