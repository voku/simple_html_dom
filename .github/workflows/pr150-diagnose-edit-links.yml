name: PR 150 diagnose edit links

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4
    paths:
      - .github/workflows/pr150-diagnose-edit-links.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --prefer-dist --no-interaction
      - name: Apply candidate patch locally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr150-finalize-html5.py')
          text = path.read_text()
          old = 'updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)'
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/pr150-finalize-html5.py patch
          python3 .github/pr150-shd11-followup.py
      - name: Mark each testEditLinks case
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Html5DomParserCompatibilityTest.php')
          text = path.read_text()
          marker = '    public function testEditLinks()\n    {'
          start = text.index(marker)
          pos = text.index('        foreach ($texts as $text => $expected) {', start)
          replacement = '''        $case = 0;
        foreach ($texts as $text => $expected) {
            \\fwrite(STDERR, "EDIT_LINKS_CASE=" . $case++ . " INPUT=" . \\json_encode($text) . "\\n");'''
          text = text[:pos] + replacement + text[pos + len('        foreach ($texts as $text => $expected) {'):]
          path.write_text(text)
          PY
          php vendor/bin/phpunit -c phpunit.xml --filter testEditLinks
