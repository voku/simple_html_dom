name: PR 150 bounded maintenance

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
          fetch-depth: 0

      - name: Apply and commit bounded fixes
        run: python3 .github/pr150-maintenance.py
