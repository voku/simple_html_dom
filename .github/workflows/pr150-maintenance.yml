name: PR 150 bounded maintenance

on:
  push:
    branches:
      - claude/php-8.4-dom-htmldocument-vronm4

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/php-8.4-dom-htmldocument-vronm4
          fetch-depth: 0

      - name: Verify runtime
        run: |
          php -v
          composer --version
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'

      - name: Apply bounded review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          source = Path('src/voku/helper/HtmlDomParser.php')
          text = source.read_text()

          old = '''            $hasXmlnsAttributes = \\stripos($html, 'xmlns') !== false
                                  &&
                                  $this->parkXmlnsAttributes($html5Document);
'''
          new = '''            $xmlnsHelper = \\stripos($html, 'xmlns') !== false
                ? $this->parkXmlnsAttributes($html5Document)
                : null;
'''
          if old not in text:
              raise SystemExit('xmlns call-site pattern not found')
          text = text.replace(old, new, 1)

          old = '''        if ($hasXmlnsAttributes) {
            $this->restoreXmlnsAttributes($document);
        }
'''
          new = '''        if ($xmlnsHelper !== null) {
            $this->restoreXmlnsAttributes($document, $xmlnsHelper);
        }
'''
          if old not in text:
              raise SystemExit('xmlns restore call-site pattern not found')
          text = text.replace(old, new, 1)

          start = text.index('    /**\n     * Rename every "xmlns" attribute of an HTML5-parsed document to a placeholder name.')
          end = text.index('    /**\n     * Check if the HTML5 parser of PHP >= 8.4 can be used on this runtime.', start)
          replacement = '''    /**
     * Rename every "xmlns" attribute of an HTML5-parsed document to a collision-free placeholder name.
     *
     * @param object $html5Document <p>A "\\Dom\\HTMLDocument" of PHP >= 8.4.</p>
     *
     * @return string|null <p>The placeholder name, or NULL when no "xmlns" attribute exists.</p>
     */
    private function parkXmlnsAttributes($html5Document): ?string
    {
        /** @phpstan-ignore class.notFound, argument.type (PHP >= 8.4 only, guarded by isHtml5ParserSupported()) */
        $xPath = new \\Dom\\XPath($html5Document);
        $elements = $xPath->query('//*[@xmlns]');

        if ($elements->length === 0) {
            return null;
        }

        $helper = self::$domHtmlXmlnsHelper;
        $suffix = 0;
        while ($xPath->query('//*[@' . $helper . ']')->length > 0) {
            $helper = self::$domHtmlXmlnsHelper . '-' . ++$suffix;
        }

        foreach ($elements as $element) {
            /** @phpstan-ignore method.notFound, method.notFound (\\Dom\\Element of PHP >= 8.4) */
            $element->setAttribute($helper, $element->getAttribute('xmlns'));
            /** @phpstan-ignore method.notFound (\\Dom\\Element of PHP >= 8.4) */
            $element->removeAttribute('xmlns');
        }

        return $helper;
    }

    /**
     * Restore the "xmlns" attributes that parkXmlnsAttributes() renamed.
     *
     * @param \\DOMDocument $document
     * @param string       $helper
     *
     * @return void
     */
    private function restoreXmlnsAttributes(\\DOMDocument $document, string $helper)
    {
        $xPath = new \\DOMXPath($document);
        $elements = $xPath->query('//*[@' . $helper . ']');

        if ($elements === false) {
            return;
        }

        foreach ($elements as $element) {
            if (!$element instanceof \\DOMElement) {
                continue;
            }

            $element->setAttribute('xmlns', $element->getAttribute($helper));
            $element->removeAttribute($helper);
        }
    }

'''
          text = text[:start] + replacement + text[end:]
          source.write_text(text)

          tests = Path('tests/HtmlDomParserHtml5Test.php')
          text = tests.read_text()
          anchor = '''    public function testDocumentStaysALegacyDomDocument()
'''
          test = '''    public function testXmlnsBridgePreservesCallerOwnedTransportAttribute()
    {
        $dom = $this->html5('<div xmlns="urn:example" data-simplevokuxmlns="caller-value"><span>x</span></div>');
        $div = $dom->findOne('div');

        static::assertTrue($dom->getIsDOMDocumentCreatedWithHtml5Parser());
        static::assertSame('urn:example', $div->getAttribute('xmlns'));
        static::assertSame('caller-value', $div->getAttribute('data-simplevokuxmlns'));
        static::assertSame('', $div->getNode()->namespaceURI ?? '');
        static::assertSame('x', $dom->findOne('div span')->text());
    }

'''
          if anchor not in text:
              raise SystemExit('HTML5 test insertion anchor not found')
          text = text.replace(anchor, test + anchor, 1)
          tests.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = '        uses: coverallsapp/github-action@v2\n'
          new = '        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2\n'
          if text.count(old) != 1:
              raise SystemExit('Coveralls action pattern not found exactly once')
          ci.write_text(text.replace(old, new, 1))

          history = Path('.agent-loop/contracts/SHD-1/history/contract.001.json')
          snapshot = json.loads(history.read_text())
          snapshot['status'] = 'approved'
          snapshot['updated_at'] = snapshot['approved_at']
          snapshot_bytes = (json.dumps(snapshot, ensure_ascii=False, indent=4) + '\n').encode()
          expected = '2063951df944d1a45c1565a8d54cf70fee3d90a95d0588c12da4b487b80507a0'
          actual = hashlib.sha256(snapshot_bytes).hexdigest()
          if actual != expected:
              raise SystemExit(f'approved revision-1 contract digest mismatch: {actual}')

          archive = Path('.agent-loop/runs/.history/SHD-1/run-SHD-1-2f8699c5565d2aa0')
          (archive / 'contract.json').write_bytes(snapshot_bytes)
          recall_path = archive / 'recall-input.json'
          recall = json.loads(recall_path.read_text())
          if recall['contract']['sha256'] != f'sha256:{expected}' or recall['contract']['revision'] != 1:
              raise SystemExit('archived Recall envelope does not bind expected revision-1 contract')
          recall['contract']['path'] = 'contract.json'
          recall_path.write_text(json.dumps(recall, ensure_ascii=False, indent=4) + '\n')
          PY

      - name: Update isolated agent-loop release set
        run: |
          composer update voku/agent-loop --with-all-dependencies --no-interaction --prefer-dist --working-dir=tools/agent-loop
          composer validate --strict --working-dir=tools/agent-loop
          php -r '
            $lock = json_decode(file_get_contents("tools/agent-loop/composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            foreach ($lock["packages"] as $package) {
                if ($package["name"] === "voku/agent-loop") {
                    if ($package["version"] !== "0.16.5") {
                        fwrite(STDERR, "Expected voku/agent-loop 0.16.5, got {$package["version"]}\n");
                        exit(1);
                    }
                    exit(0);
                }
            }
            fwrite(STDERR, "voku/agent-loop not found in lock file\n");
            exit(1);
          '

      - name: Validate bounded result
        run: |
          php -l src/voku/helper/HtmlDomParser.php
          php -l tests/HtmlDomParserHtml5Test.php
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .agent-loop/runs/.history/SHD-1/run-SHD-1-2f8699c5565d2aa0/contract.json \
            .agent-loop/runs/.history/SHD-1/run-SHD-1-2f8699c5565d2aa0/recall-input.json \
            .github/workflows/ci.yml \
            src/voku/helper/HtmlDomParser.php \
            tests/HtmlDomParserHtml5Test.php \
            tools/agent-loop/composer.lock | sort)"

      - name: Commit fixes and remove helper workflow
        env:
          BRANCH: claude/php-8.4-dom-htmldocument-vronm4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .agent-loop/runs/.history/SHD-1/run-SHD-1-2f8699c5565d2aa0/contract.json \
            .agent-loop/runs/.history/SHD-1/run-SHD-1-2f8699c5565d2aa0/recall-input.json \
            .github/workflows/ci.yml \
            src/voku/helper/HtmlDomParser.php \
            tests/HtmlDomParserHtml5Test.php \
            tools/agent-loop/composer.lock
          git rm .github/workflows/pr150-maintenance.yml
          git commit -m 'Fix bounded PR review findings'
          git push origin "HEAD:${BRANCH}"
